name: archon-feature-development-CHN
description: |
  适用场景：根据已有计划实现功能。
  输入：计划文件路径（$ARTIFACTS_DIR/plan.md）或包含计划的 GitHub issue。
  功能：实现计划并通过验证循环 -> 创建拉取请求。
  不适用于：创建计划（计划应单独创建）、缺陷修复、代码审查。

nodes:
  - id: implement
    command: archon-implement
    model: opus[1m]

  - id: create-pr
    command: archon-create-pr
    depends_on: [implement]
    context: fresh

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "PR #$PR_NUMBER 的目标分支不匹配：预期=$EXPECTED 实际=$ACTUAL — 正在重新设置目标分支" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR 目标分支已验证：$EXPECTED"
      fi
    depends_on: [create-pr]
