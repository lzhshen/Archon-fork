name: archon-piv-loop-CHN
description: |
  适用场景：用户希望进行带人工介入的引导式"计划-实现-验证"（PIV）开发流程。
  触发词："piv"、"piv loop"、"plan implement validate"、"guided development"、
          "structured development"、"build a feature"、"develop with review"。
  不适用于：无需规划的自主实现（请使用 archon-feature-development）。
  不适用于：PRD 创建（请使用 archon-interactive-prd）。
  不适用于：基于 Ralph 故事的实现（请使用 archon-ralph-dag）。

  交互式 PIV 循环工作流 —— 基础 AI 编码方法论：
  1. 探索（EXPLORE）：与人类进行迭代对话以理解问题（任意轮次）
  2. 计划（PLAN）：创建结构化计划 -> 迭代审查与修订（任意轮次）
  3. 实现（IMPLEMENT）：按计划逐任务自主实现（Ralph 循环）
  4. 验证（VALIDATE）：自动化代码审查 -> 迭代人工反馈与修复（任意轮次）

  PIV 循环在 PRD 已存在之后启动。每个 PIV 循环专注于一个细粒度的功能或缺陷修复。
  输入：要构建的内容描述、现有计划的路径，或 GitHub issue 编号。

provider: claude
interactive: true

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 阶段 1：探索 —— 与人类进行迭代探索
  # 理解需求、探索代码库、收敛方案
  # 循环直到用户表示准备好创建计划。
  # ═══════════════════════════════════════════════════════════════

  - id: explore
    loop:
      prompt: |
        # PIV 循环 —— 探索阶段

        你是一位资深工程合作伙伴，正在进行迭代探索会话。
        你的目标：在任何代码编写之前，深入理解要构建什么。

        **用户请求**：$ARGUMENTS
        **用户最新输入**：$LOOP_USER_INPUT

        ---

        ## 如果这是第一次迭代（尚无用户输入）：

        ### 步骤 1：解析输入

        判断用户提供了什么：

        **如果是文件路径**（以 `.md`、`.plan.md` 或 `.prd.md` 结尾）：
        - 读取该文件
        - 如果是已有计划 → 总结并询问是否需要细化或直接开始
        - 如果是 PRD → 确定要关注的具体阶段/功能

        **如果是 GitHub issue**（`#123` 格式）：
        - 获取：`gh issue view {number} --json title,body,labels,comments`
        - 总结 issue 背景

        **如果是自由文本**：
        - 这是一个功能想法或缺陷描述。直接使用。

        ### 步骤 2：探索代码库

        在提问之前，先做好功课：

        1. **阅读 CLAUDE.md** —— 理解项目约定、架构和约束
        2. **搜索相关代码** —— 找到与用户需求类似的已有实现
        3. **阅读关键文件** —— 理解用户要修改的代码的当前状态
        4. **检查最近的 git 历史** —— `git log --oneline -20` 查看该区域的近期变更

        ### 步骤 3：展示你的理解

        ```
        ## 我的理解

        你想要：{用 2-3 句话重述理解}

        ## 已有的内容

        - {文件:行号} — {它的功能及关联}
        - {文件:行号} — {它的功能及关联}
        - {模式/组件} — {如何扩展或复用}

        ## 初步架构思路

        基于已有内容，我在考虑：
        - {方案 1 —— 扩展现有的 X}
        - {方案 2 —— 如果方案 1 不可行}
        - {需要你输入的关键架构决策}
        ```

        ### 步骤 4：提出针对性问题

        提出 4-6 个聚焦于决策的问题，而非信息收集：
        - 范围边界、架构偏好、技术决策
        - 约束条件、扩展现有代码还是全新构建、测试预期
        - 引用你找到的实际代码 —— 不要问泛泛的问题

        ---

        ## 如果用户已提供输入（后续迭代）：

        ### 步骤 1：处理他们的回复

        仔细阅读他们的回答。识别：
        - 他们做出的决策
        - 他们希望你进一步探索的领域
        - 他们反问你的问题（用证据回答！）

        ### 步骤 2：进行针对性调研

        根据他们的回复：
        - 如果他们提到了特定技术 → 调研最佳实践
        - 如果他们指向特定代码 → 仔细阅读
        - 如果他们要求你探索某个区域 → 进行彻底调查
        - 如果他们做出了架构决策 → 对照代码库验证

        ### 步骤 3：展示更新的理解

        展示你学到的内容，用 文件:行号 引用回答他们的问题，
        并展示你精炼后的架构建议。

        ### 步骤 4：收敛或继续

        **如果仍有重要的未决问题：**
        提出 2-4 个聚焦于剩余歧义的问题。

        **如果情况已经清晰，你有足够信息创建计划：**
        展示最终实现总结：

        ```
        ## 实现总结

        ### 要构建什么
        {清晰、具体的描述}

        ### 范围边界
        - 包含：{包含的内容}
        - 排除：{明确排除的内容}

        ### 架构
        - {关键决策}

        ### 将变更的文件
        - `{文件}` — {变更内容及原因}

        ### 成功标准
        - [ ] {具体、可测试的标准}
        - [ ] 所有验证通过

        ### 主要风险
        - {风险 —— 及缓解措施}
        ```

        然后告诉用户："我已经有了清晰的认识。说 **ready** 我就创建
        结构化实现计划，或者分享你最后的想法。"

        **关键 —— 请仔细阅读**：
        - 永远不要输出 <promise>PLAN_READY</promise>，除非用户最新的消息包含
          明确的短语，如 "ready"、"create the plan"、"let's go"、"proceed" 或 "I'm done"。
        - 如果用户提出了问题 → 不要发出信号。回答问题。
        - 如果用户给出了反馈或要求修改 → 不要发出信号。处理它。
        - 如果用户说 "also check X" 或 "one more thing" → 不要发出信号。探索它。
        - 如果你不确定用户是否在确认 → 不要发出信号。询问他们。
        - 唯一正确发出信号的时机是用户的消息明确表示
          "停止探索，我准备好让你创建计划了。"
      until: PLAN_READY
      max_iterations: 15
      interactive: true
      gate_message: |
        回答上面的问题，让我探索特定领域，
        或者在你对探索结果满意时说 "ready"。

  # ═══════════════════════════════════════════════════════════════
  # 阶段 2：计划 —— 创建结构化实现计划
  # ═══════════════════════════════════════════════════════════════

  - id: create-plan
    model: sonnet
    depends_on: [explore]
    context: fresh
    prompt: |
      # PIV 循环 —— 创建结构化计划

      你正在从已完成的探索阶段创建结构化实现计划。
      此计划将是实现代理的唯一指南 —— 它必须完整、具体且可操作。

      **原始请求**：$ARGUMENTS
      **最终探索总结**：$explore.output

      ---

      ## 步骤 1：阅读代码库（再次）

      在编写计划之前，验证你的理解是最新的：

      1. **阅读 CLAUDE.md** —— 获取所有相关约定
      2. **阅读你计划修改的每个文件** —— 记录确切当前状态
      3. **阅读示例测试文件** —— 理解测试模式
      4. **检查最近的变更** —— `git log --oneline -10`

      ## 步骤 2：计划文件位置

      将计划保存到 `$ARTIFACTS_DIR/plan.md`。
      该目录已存在（由工作流执行器预先创建）。

      ## 步骤 3：编写计划

      使用以下模板。用具体、已验证的信息填写每个部分。

      ```markdown
      # 功能：{标题}

      ## 概要
      {1-2 句话：变更内容及原因}

      ## 目标
      {一句话核心目标}

      ## 成功标准
      - [ ] {具体、可测试的标准}
      - [ ] 所有验证通过（`bun run validate` 或等效命令）
      - [ ] 现有测试无回归

      ## 范围
      ### 范围内
      - {要构建的内容}
      ### 范围外
      - {不构建的内容 —— 及原因}

      ## 代码库背景
      ### 关键文件
      | 文件 | 作用 | 操作 |
      |------|------|--------|
      | `{路径}` | {功能描述} | CREATE / UPDATE |

      ### 遵循的模式
      {代码库中需要镜像的实际代码片段}

      ## 架构
      - {决策 1 —— 附理由}
      - {决策 2 —— 附理由}

      ## 任务列表
      按顺序执行。每个任务是原子的且可独立验证。

      ### 任务 1：{操作} `{文件路径}`
      **操作**：CREATE / UPDATE
      **详情**：{确切变更 —— 足够具体，让无上下文的代理也能理解}
      **模式**：遵循 `{源文件}:{行号}`
      **验证**：`{验证此任务的命令}`

      ## 测试策略
      | 测试文件 | 测试用例 | 验证内容 |
      |-----------|-----------|-----------|
      | `{路径}` | {用例} | {验证的内容} |

      ## 验证命令
      1. 类型检查：`{命令}`
      2. 代码检查：`{命令}`
      3. 测试：`{命令}`
      4. 完整验证：`{命令}`

      ## 风险
      | 风险 | 影响 | 缓解措施 |
      |------|--------|------------|
      | {风险} | {HIGH/MED/LOW} | {具体缓解措施} |
      ```

      ## 步骤 4：验证计划

      1. 检查引用的每个文件路径 —— 验证它们存在
      2. 检查引用的每个模式 —— 验证代码匹配
      3. 检查任务排序 —— 确保依赖关系被遵守
      4. 检查完整性 —— 无上下文的代理能否实现此计划？

      ## 步骤 5：报告

      ```
      ## 计划已创建

      **文件**：`$ARTIFACTS_DIR/plan.md`
      **任务数**：{数量}
      **待变更文件数**：{数量}

      关键决策：
      - {决策 1}
      - {决策 2}

      请审查计划并提供反馈。
      ```

  # ═══════════════════════════════════════════════════════════════
  # 阶段 2b：计划 —— 迭代计划细化
  # 根据需要多次审查和修订计划。
  # ═══════════════════════════════════════════════════════════════

  - id: refine-plan
    depends_on: [create-plan]
    loop:
      prompt: |
        # PIV 循环 —— 计划细化

        用户正在审查实现计划并提供反馈。

        **用户反馈**：$LOOP_USER_INPUT

        ---

        ## 步骤 1：阅读计划

        阅读 `$ARTIFACTS_DIR/plan.md` 和 CLAUDE.md 了解约定。

        ## 步骤 2：处理反馈

        **如果尚无用户反馈**（第一次迭代，$LOOP_USER_INPUT 为空）：
        - 仔细阅读计划
        - 展示计划关键决策和任务列表的总结
        - 请用户审查并提供反馈
        - 不要在第一次迭代发出完成信号

        **如果用户明确批准**（说了 "approved"、"looks good"、"let's go" 等）：
        - 不做任何修改
        - 输出："计划已批准。进入实现阶段。"
        - 发出完成信号：<promise>PLAN_APPROVED</promise>

        **如果用户提供了具体反馈：**
        - 解析每条反馈
        - 直接编辑计划文件：
          - 按要求添加/删除/修改任务
          - 如有需要更新成功标准
          - 如有需要调整测试策略
          - 修改后重新验证文件路径和模式

        **关键**：永远不要发出 <promise>PLAN_APPROVED</promise>，除非用户最新的
        消息明确说了 "approved"、"looks good"、"ship it" 或类似批准用语。
        问题、反馈和修改请求不算批准。

        ## 步骤 3：展示变更

        ```
        ## 计划已修订

        所做变更：
        - {变更 1}
        - {变更 2}

        更新统计：
        - 任务数：{数量}
        - 待变更文件数：{数量}

        审查更新后的计划并提供更多反馈，或说 "approved" 继续。
        ```
      until: PLAN_APPROVED
      max_iterations: 10
      interactive: true
      gate_message: |
        审查计划文档。提供关于需要修改的具体反馈，
        或说 "approved" 开始实现。

  # ═══════════════════════════════════════════════════════════════
  # 阶段 3：实现 —— 准备
  # 读取计划，准备环境
  # ═══════════════════════════════════════════════════════════════

  - id: implement-setup
    depends_on: [refine-plan]
    bash: |
      set -e

      PLAN_FILE="$ARTIFACTS_DIR/plan.md"

      if [ ! -f "$PLAN_FILE" ]; then
        echo "错误：未找到计划文件 $ARTIFACTS_DIR/plan.md"
        exit 1
      fi

      # 按需安装依赖
      if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
        echo "正在安装依赖..."
        bun install --frozen-lockfile 2>&1 | tail -3
      elif [ -f "package-lock.json" ]; then
        npm ci 2>&1 | tail -3
      elif [ -f "yarn.lock" ]; then
        yarn install --frozen-lockfile 2>&1 | tail -3
      elif [ -f "pnpm-lock.yaml" ]; then
        pnpm install --frozen-lockfile 2>&1 | tail -3
      fi

      echo "BRANCH=$(git branch --show-current)"
      echo "GIT_ROOT=$(git rev-parse --show-toplevel)"
      echo "PLAN_FILE=$PLAN_FILE"

      echo "=== PLAN_START ==="
      cat "$PLAN_FILE"
      echo ""
      echo "=== PLAN_END ==="

      TASK_COUNT=$(grep -c "^### Task [0-9]" "$PLAN_FILE" 2>/dev/null || echo "0")
      if [ "$TASK_COUNT" -eq 0 ]; then
        echo "错误：在 $PLAN_FILE 中未找到 '### Task N:' 部分。计划格式可能有误。"
        exit 1
      fi
      echo "TASK_COUNT=${TASK_COUNT}"

  # ═══════════════════════════════════════════════════════════════
  # 阶段 3b：实现 —— 逐任务循环（Ralph 模式）
  # 每次迭代使用全新上下文。从磁盘读取计划。
  # 每次迭代一个任务。验证后提交。
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    depends_on: [implement-setup]
    idle_timeout: 600000
    model: claude-opus-4-6[1m]
    loop:
      prompt: |
        # PIV 循环 —— 实现代理

        你是一个全新会话中的自主编码代理 —— 没有之前迭代的记忆。
        你的工作：从磁盘读取计划、实现一个任务、验证、提交、更新跟踪、退出。

        **黄金法则**：如果验证失败，先修复再提交。永远不要提交有问题的代码。

        ---

        ## 阶段 0：上下文 —— 加载状态

        准备节点产生了以下上下文：

        $implement-setup.output

        **用户的原始请求**：$USER_MESSAGE

        ---

        ### 0.1 解析计划文件

        从上面的上下文中提取 `PLAN_FILE=...` 行。

        ### 0.2 读取当前状态（从磁盘 —— 而非上面的上下文）

        上面的上下文是循环开始前的快照。之前的迭代可能已经
        改变了内容。**你必须从磁盘重新读取：**

        1. **读取计划文件** —— 你的实现指南
        2. **读取进度跟踪** —— 检查 `$ARTIFACTS_DIR/progress.txt` 是否存在
        3. **读取 CLAUDE.md** —— 项目约定和约束

        ### 0.3 检查 Git 状态

        ```bash
        git log --oneline -10
        git status
        ```

        ---

        ## 阶段 1：选择 —— 选择下一个任务

        从计划文件中，通过 `### Task N:` 标题识别任务。
        与之前迭代的提交和进度跟踪进行交叉对照。

        **如果所有任务已完成** → 跳到阶段 5（完成）。

        ### 公告所选任务

        ```
        -- 已选任务 ------------------------------------------------
        任务：{N} — {任务标题}
        操作：{CREATE / UPDATE}
        文件：{文件路径}
        -----------------------------------------------------------------
        ```

        ---

        ## 阶段 2：实现 —— 执行任务

        1. 读取你即将修改的文件（如果存在）
        2. 阅读计划中引用的模式文件
        3. 严格按照计划进行修改
        4. 每个文件修改后进行类型检查：`bun run type-check 2>&1 || true`

        ---

        ## 阶段 3：验证 —— 验证任务

        ```bash
        bun run type-check && bun run lint && bun run test && bun run format:check
        ```

        如果验证失败：修复并重新运行（最多 3 次尝试）。如果无法修复，在进度跟踪中
        记录，并且不要提交有问题的代码。

        ---

        ## 阶段 4：提交 —— 保存变更

        只暂存你为此 PIV 任务编辑的文件 —— 永远不要使用 `git add -A`、`git add .` 或 `git add -u`。按名称列出文件：

        ```bash
        git add path/to/file1 path/to/file2 ...
        git status --porcelain  # 验证没有暂存 scratch/review/PR-body 文件
        git diff --cached --stat
        git commit -m "$(cat <<'EOF'
        {类型}: {任务描述}

        PIV 任务 {N}：{简要详情}
        EOF
        )"
        ```

        **永远不要暂存**：`.pr-body.md`、`pr-body.md`、`*.scratch.md`、`*.tmp.md`、`review/`、仓库根目录的 `*-report.md`，或 `$ARTIFACTS_DIR` 下的任何内容。

        在 `$ARTIFACTS_DIR/progress.txt` 中跟踪进度：
        ```
        ## 任务 {N}：{标题} — 已完成
        日期：{ISO 日期}
        文件：{列表}
        提交：{短哈希}
        ---
        ```

        ---

        ## 阶段 5：完成 —— 检查所有任务

        如果所有任务已完成：
        1. 运行完整验证：`bun run validate 2>&1`
        2. 推送：`git push -u origin HEAD`
        3. 发出信号：`<promise>COMPLETE</promise>`

        如果仍有任务未完成，报告状态并正常结束。循环引擎将启动新的迭代。
      until: COMPLETE
      max_iterations: 15
      fresh_context: true

  # ═══════════════════════════════════════════════════════════════
  # 阶段 4：验证 —— 自动化代码审查
  # 根据计划审查所有变更
  # ═══════════════════════════════════════════════════════════════

  - id: code-review
    model: sonnet
    depends_on: [implement]
    context: fresh
    prompt: |
      # PIV 循环 —— 自动化代码审查

      实现阶段已完成。根据计划审查所有变更。

      **实现输出**：$implement.output

      ---

      ## 步骤 1：阅读计划

      阅读 `$ARTIFACTS_DIR/plan.md` 以了解预期的实现。

      ## 步骤 2：审查所有变更

      ```bash
      git log --oneline --no-merges $(git merge-base HEAD $BASE_BRANCH)..HEAD
      git diff $BASE_BRANCH..HEAD --stat
      git diff $BASE_BRANCH..HEAD
      ```

      ## 步骤 3：对照计划检查

      对于每个任务：是否正确实现？成功标准是否满足？
      对于每个文件：检查质量、安全性、模式、CLAUDE.md 合规性。

      ## 步骤 4：运行验证

      ```bash
      bun run validate 2>&1 || (bun run type-check && bun run lint && bun run test && bun run format:check)
      ```

      ## 步骤 5：修复明显问题

      修复类型错误、代码检查警告、缺失导入、格式问题。只暂存你修复的文件 —— 永远不要 `git add -A`。如果没有修复则跳过提交：
      ```bash
      git add path/to/file1 path/to/file2 ...  # 只列出实际修复的文件
      git status --porcelain  # 验证没有暂存 scratch/review/PR-body 文件
      git diff --cached --quiet || git commit -m "fix: 修复代码审查发现的问题"
      ```

      **永远不要暂存**：`.pr-body.md`、`pr-body.md`、`*.scratch.md`、`*.tmp.md`、`review/`、仓库根目录的 `*-report.md`，或 `$ARTIFACTS_DIR` 下的任何内容。

      ## 步骤 6：展示审查结果

      ```
      ## 代码审查完成

      ### 实现状态
      | 任务 | 状态 | 备注 |
      |------|--------|-------|
      | {任务} | 已完成 / 部分完成 / 缺失 | {备注} |

      ### 验证结果
      - 类型检查：通过 / 未通过
      - 代码检查：通过 / 未通过
      - 测试：通过 / 未通过
      - 格式检查：通过 / 未通过

      ### 代码质量发现
      {发现的问题，或"未发现问题。"}

      ### 建议
      {准备就绪 / 需要修复}
      ```

  # ═══════════════════════════════════════════════════════════════
  # 阶段 4b：验证 —— 迭代人工反馈与修复
  # 用户测试实现并提供反馈。
  # 循环直到用户批准。
  # ═══════════════════════════════════════════════════════════════

  - id: fix-feedback
    depends_on: [code-review]
    loop:
      prompt: |
        # PIV 循环 —— 处理验证反馈

        人工已审查了实现并提供了反馈。

        **人工反馈**：$LOOP_USER_INPUT

        ---

        ## 步骤 1：读取上下文

        阅读 `$ARTIFACTS_DIR/plan.md` 和 CLAUDE.md 了解约定。

        ## 步骤 2：处理反馈

        **如果尚无用户反馈**（第一次迭代，$LOOP_USER_INPUT 为空）：
        - 展示代码审查结果并请用户测试实现
        - 不要在第一次迭代发出完成信号

        **如果用户明确批准**（说了 "approved"、"looks good"、"ship it" 等）：
        - 输出："实现已批准！"
        - 发出信号：<promise>VALIDATED</promise>

        **关键**：永远不要发出 <promise>VALIDATED</promise>，除非用户最新的
        消息明确说了 "approved"、"looks good"、"ship it" 或类似批准用语。

        **如果用户提供了具体反馈：**
        1. 阅读相关文件
        2. 理解每个问题
        3. 进行修复
        4. 每次修改后进行类型检查

        ## 步骤 3：完整验证

        ```bash
        bun run validate 2>&1 || (bun run type-check && bun run lint && bun run test && bun run format:check)
        ```

        ## 步骤 4：提交修复

        只暂存你在处理反馈时实际编辑的文件 —— 永远不要 `git add -A`。按名称列出文件：

        ```bash
        git add path/to/file1 path/to/file2 ...
        git status --porcelain  # 验证没有暂存 scratch/review/PR-body 文件
        git commit -m "$(cat <<'EOF'
        fix: 处理审查反馈

        变更：
        - {修复 1}
        - {修复 2}
        EOF
        )"
        ```

        **永远不要暂存**：`.pr-body.md`、`pr-body.md`、`*.scratch.md`、`*.tmp.md`、`review/`、仓库根目录的 `*-report.md`，或 `$ARTIFACTS_DIR` 下的任何内容。

        ## 步骤 5：报告

        ```
        ## 反馈已处理

        所做变更：
        - {修复 1}
        - {修复 2}

        验证结果：{通过 / 未通过及详情}

        再次审查，或说 "approved" 完成定稿。
        ```
      until: VALIDATED
      max_iterations: 10
      interactive: true
      gate_message: |
        自行测试实现并审查代码变更。
        提供关于需要修复的具体反馈，或说 "approved" 完成定稿。

  # ═══════════════════════════════════════════════════════════════
  # 阶段 5：收尾 —— 推送、创建 PR、生成总结
  # ═══════════════════════════════════════════════════════════════

  - id: finalize
    model: sonnet
    depends_on: [fix-feedback]
    context: fresh
    prompt: |
      # PIV 循环 —— 收尾

      实现已获批准。推送变更并创建 PR。

      ---

      ## 步骤 1：推送变更

      ```bash
      git push -u origin HEAD 2>&1 || echo "警告：推送失败 —— 请在创建 PR 前验证远程认证和分支状态。"
      ```

      ## 步骤 2：生成总结

      ```bash
      git log --oneline --no-merges $(git merge-base HEAD $BASE_BRANCH)..HEAD
      git diff --stat $(git merge-base HEAD $BASE_BRANCH)..HEAD
      ```

      阅读 `$ARTIFACTS_DIR/plan.md` 和 `$ARTIFACTS_DIR/progress.txt` 获取上下文。

      ## 步骤 3：创建 PR（如果尚未创建）

      ```bash
      gh pr view HEAD --json url 2>/dev/null || echo "NO_PR"
      ```

      如果没有 PR：

      ```bash
      cat .github/pull_request_template.md 2>/dev/null || echo "NO_TEMPLATE"
      ```

      使用 `gh pr create --draft --base $BASE_BRANCH` 创建：
      - 标题取自计划的功能名称
      - 正文总结实现内容
      - 使用 HEREDOC 编写正文

      ## 步骤 4：输出总结

      ```
      ===============================================================
      PIV 循环 —— 完成
      ===============================================================

      功能：{来自计划}
      计划：{计划文件路径}
      分支：{分支名称}
      PR：{URL}

      -- 已完成任务 -----------------------------------------------
      {来自进度跟踪的列表}

      -- 提交记录 -------------------------------------------------------
      {git log 输出}

      -- 变更文件 -------------------------------------------------
      {git diff --stat 输出}

      -- 验证 ----------------------------------------------------
      所有检查已通过。
      ===============================================================
      ```

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "PR #$PR_NUMBER 的基础分支不匹配：期望=$EXPECTED 实际=$ACTUAL —— 正在重新定向" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR 基础分支已验证：$EXPECTED"
      fi
    depends_on: [finalize]
