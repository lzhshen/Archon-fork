name: archon-workflow-builder-CHN
description: |
  适用场景：用户想要为其项目创建新的自定义工作流。
  触发词："帮我构建一个工作流"、"创建一个工作流"、"生成一个工作流"、
            "新工作流"、"制作一个工作流"、"工作流构建器"。
  能力：扫描代码库 -> 提取意图(JSON) -> 生成YAML -> 验证 -> 保存。
  不适用于：编辑现有工作流或创建非工作流文件。

nodes:
  - id: scan-codebase
    bash: |
      echo "=== 已有命令 ==="
      if [ -d ".archon/commands" ]; then
        find .archon/commands -type f -name "*.md" 2>/dev/null | head -30
      else
        echo "(无 .archon/commands/ 目录)"
      fi

      echo ""
      echo "=== 已有工作流 ==="
      if [ -d ".archon/workflows" ]; then
        find .archon/workflows -type f \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | head -30
      else
        echo "(无 .archon/workflows/ 目录)"
      fi

      echo ""
      echo "=== 包信息 ==="
      if [ -f "package.json" ]; then
        grep -E '"name"|"scripts"' package.json | head -10
      else
        echo "(无 package.json)"
      fi

      echo ""
      echo "=== 项目上下文 (CLAUDE.md 前 50 行) ==="
      if [ -f "CLAUDE.md" ]; then
        head -50 CLAUDE.md
      else
        echo "(无 CLAUDE.md)"
      fi

  - id: extract-intent
    prompt: |
      你是一个工作流设计分类器。根据用户对工作流功能的描述，提取结构化意图。

      ## 用户请求
      $ARGUMENTS

      ## 代码库上下文
      $scan-codebase.output

      ## 说明

      分析用户的请求和现有代码库，确定以下内容：
      1. 一个 kebab-case 格式的工作流名称（例如："lint-and-test"、"deploy-staging"）
      2. 遵循 Archon 模式的描述（适用场景 / 触发词 / 能力 / 不适用于）
      3. 路由器应匹配的触发短语
      4. 建议的节点列表及其类型和用途
      5. 是否应为简单的 DAG 还是包含循环节点

      请具体且明确。每个建议的节点应有清晰的类型
      （bash、prompt、command、script、loop 或 approval）以及一行描述说明其功能。
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        workflow_name:
          type: string
        description:
          type: string
        trigger_phrases:
          type: string
        proposed_nodes:
          type: string
        execution_mode:
          type: string
          enum: ["dag", "loop"]
      required: [workflow_name, description, trigger_phrases, proposed_nodes, execution_mode]
    depends_on: [scan-codebase]

  - id: generate-yaml
    prompt: |
      你是一个 Archon 工作流编写者。根据提供的结构化意图，生成一个完整、有效的工作流 YAML 文件。

      ## 意图
      - **名称**：$extract-intent.output.workflow_name
      - **描述**：$extract-intent.output.description
      - **触发短语**：$extract-intent.output.trigger_phrases
      - **建议节点**：$extract-intent.output.proposed_nodes
      - **执行模式**：$extract-intent.output.execution_mode

      ## 原始用户请求
      $ARGUMENTS

      ## Archon 工作流 YAML 模式参考

      工作流 YAML 文件具有以下结构：

      ```yaml
      name: workflow-name
      description: |
        适用场景：...
        触发词：...
        能力：...
        不适用于：...

      # 可选的顶级设置：
      # provider: claude    (或 codex)
      # model: sonnet       (或 haiku、opus 等)
      # interactive: true   (强制在 Web UI 中前台执行)

      nodes:
        - id: node-id-kebab-case
          # 选择以下之一：prompt、bash、command、script、loop、approval

          # --- prompt 节点 (AI 执行) ---
          prompt: |
            AI 的指令...
          # 可选：model、allowed_tools、denied_tools、output_format、context、idle_timeout

          # --- bash 节点 (shell 脚本，无 AI，stdout = $<nodeId>.output) ---
          bash: |
            #!/bin/bash
            set -e
            echo "result"

          # --- command 节点 (引用 .archon/commands/ 文件) ---
          command: command-name

          # --- script 节点 (通过 bun 的 TypeScript，或通过 uv 的 Python — 无 AI，stdout = $<nodeId>.output) ---
          # 用于 shell 难以处理的确定性数据转换（JSON 解析等）
          script: |
            // JSON 是有效的 JS 表达式语法 — 直接赋值即可（String.raw 在反引号处会出错）
            const data = $other-node.output;
            console.log(JSON.stringify({ count: data.items.length }));
          runtime: bun                       # 必填：'bun' (.ts/.js) 或 'uv' (.py)
          # deps: [requests]                 # 仅 uv
          # 或者引用 .archon/scripts/ 中的命名脚本：
          # script: extract-labels           # 无扩展名；bun 解析 .ts/.js，uv 解析 .py

          # --- loop 节点 (迭代式 AI 执行) ---
          loop:
            prompt: |
              每次迭代重复的指令...
            until: COMPLETION_SIGNAL
            max_iterations: 10
            fresh_context: true  # 可选：每次迭代重置上下文

          # --- approval 节点 (人工门控 — 暂停工作流) ---
          approval:
            message: "请审查上述计划。批准后继续。"
            # capture_response: true         # 将审阅者评论存储为 $<nodeId>.output

          # 所有节点类型的通用选项：
          depends_on: [other-node-id]       # DAG 边
          when: "$<other-node>.output == 'value'"  # 条件执行
          trigger_rule: all_success          # all_success | one_success | all_done
          timeout: 120000                    # 毫秒，用于 bash 和 script 节点
      ```

      ## 变量参考
      - `$ARGUMENTS` — 用户输入文本
      - `$ARTIFACTS_DIR` — 预创建的工作流工件目录
      - `$<nodeId>.output` — bash/script 节点的 stdout 或 prompt 节点的 AI 响应
      - `$<nodeId>.output.field` — 具有 output_format 的节点的 JSON 字段
      - `$BASE_BRANCH` — 基础 git 分支

      ## 规则
      1. `name:` 字段必须匹配：$extract-intent.output.workflow_name
      2. `description:` 必须遵循"适用场景 / 触发词 / 能力 / 不适用于"模式
      3. 每个节点必须有唯一的 kebab-case 格式 `id`
      4. 使用 `depends_on` 定义执行顺序
      5. 使用 `bash` 节点处理确定性 shell 操作（文件检查、git 命令、安装）
      6. 使用 `script` 节点处理类型化数据转换（TypeScript JSON 解析、带依赖的 Python）
         — stdout 作为输出捕获，stderr 作为警告转发。
         `$nodeId.output` 在脚本体中不会被 shell 引用转义。
         - **TypeScript/bun**：直接赋值 — `const data = $nodeId.output;`
           （JSON 是有效的 JS 表达式语法；避免使用 String.raw — 它在反引号处会出错）
         - **Python/uv**：使用 json.loads — `import json; data = json.loads("""$nodeId.output""")`
         绝不要插入到 shell 语法中。
      7. 使用 `prompt` 节点处理 AI 推理任务
      8. 使用 `approval` 节点在风险门控处暂停等待人工审查（计划→执行边界、破坏性操作）
      9. 当下游节点需要结构化数据时，在 prompt 节点上使用 `output_format`
      10. 在不需要工具的分类/分析节点上使用 `allowed_tools: []`
      11. 当节点只应使用 Write（而非编辑现有文件）时，使用 `denied_tools: [Edit, Bash]`
      12. 对于简单的分类任务，优先使用 `model: haiku` 以节省成本

      ## 输出

      将完整的工作流 YAML 写入：`$ARTIFACTS_DIR/generated-workflow.yaml`

      使用 Write 工具。不要使用 Edit 或 Bash。文件必须是有效的 YAML 并遵循上述所有模式。
    denied_tools: [Edit, Bash]
    depends_on: [extract-intent]

  - id: validate-yaml
    bash: |
      FILE="$ARTIFACTS_DIR/generated-workflow.yaml"

      if [ ! -f "$FILE" ]; then
        echo "错误：在 $FILE 未找到 generated-workflow.yaml"
        exit 1
      fi

      if [ ! -s "$FILE" ]; then
        echo "错误：generated-workflow.yaml 为空文件"
        exit 1
      fi

      if ! grep -q "^name:" "$FILE"; then
        echo "错误：缺少 'name:' 字段"
        exit 1
      fi

      if ! grep -q "^nodes:" "$FILE"; then
        echo "错误：缺少 'nodes:' 字段"
        exit 1
      fi

      echo "验证通过"
    depends_on: [generate-yaml]

  - id: save-or-report
    prompt: |
      你是一个工作流安装器。保存生成的工作流并向用户报告。

      ## 工作流详情
      - **名称**：$extract-intent.output.workflow_name
      - **触发短语**：$extract-intent.output.trigger_phrases

      ## 说明

      1. 从 `$ARTIFACTS_DIR/generated-workflow.yaml` 读取生成的工作流
      2. 如果目录 `.archon/workflows/` 不存在则创建（使用 Bash：`mkdir -p .archon/workflows/`）
      3. 将工作流保存到 `.archon/workflows/$extract-intent.output.workflow_name.yaml`
         使用 Write 工具写入文件。
      4. 向用户报告：
         - 工作流名称和文件位置
         - 将触发它的触发短语
         - 运行方式：`bun run cli workflow run $extract-intent.output.workflow_name "你的输入"`
         - 测试方式：`bun run cli validate workflows $extract-intent.output.workflow_name`
    depends_on: [validate-yaml]
