name: archon-interactive-prd-CHN
description: |
  适用场景：用户希望通过引导式对话创建产品需求文档（PRD）。
  触发词："创建PRD"、"新建PRD"、"交互式PRD"、"规划功能"、
          "产品需求"、"撰写PRD"。
  不适用于：无需人工输入的自动化PRD生成（请使用 archon-ralph-generate）。

  通过引导式对话完成以问题为核心的PRD创建流程：
  1. 理解想法 → 提出基础问题 → 等待回答
  2. 调研市场与代码库 → 提出深入问题 → 等待回答
  3. 评估技术可行性 → 提出范围问题 → 等待回答
  4. 生成PRD → 针对代码库验证技术声明 → 输出

provider: claude
interactive: true

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 阶段1：启动 — 理解想法
  # ═══════════════════════════════════════════════════════════════

  - id: initiate
    model: sonnet
    prompt: |
      你是一位敏锐的产品经理，正在启动PRD创建流程。
      你从第一性原理出发思考——从基本要素开始，而非从功能开始。

      用户想要构建：$ARGUMENTS

      如果输入清晰，用2-3句话重述你的理解并确认：
      "我理解你想构建：{重述的理解}。这样理解正确吗？"

      如果输入模糊或为空，请询问：
      "你想构建什么？请描述产品、功能或能力。"

      然后展示基础问题（一次性全部展示——用户将在下一步回答）：

      **基础问题：**

      1. **谁**有这个问题？要具体——不要只说"用户"，而是说明是哪类人/角色？
      2. **什么**问题困扰着他们？描述可观察到的痛点，而非假定的需求。
      3. **为什么**他们现在无法解决？有哪些替代方案，为什么它们行不通？
      4. **为什么是现在？**发生了什么变化，让这值得去构建？
      5. **如何**判断问题已解决？成功的标准是什么？

      保持对话风格。暂时不要生成任何PRD内容。

  # ═══════════════════════════════════════════════════════════════
  # 关卡1：用户回答基础问题
  # ═══════════════════════════════════════════════════════════════

  - id: foundation-gate
    approval:
      message: "请回答上面的基础问题。你的回答将指导后续的调研阶段。"
      capture_response: true
    depends_on: [initiate]

  # ═══════════════════════════════════════════════════════════════
  # 阶段2：调研 — 了解市场与代码库
  # ═══════════════════════════════════════════════════════════════

  - id: research
    model: sonnet
    prompt: |
      你正在为PRD调研背景信息。从第一性原理出发思考——
      在提出任何新方案之前，先了解已经存在什么。

      **核心想法**：$ARGUMENTS

      **用户的基础回答**：
      $foundation-gate.output

      调研现状：

      1. 搜索网络，了解类似产品、竞争对手以及他人如何解决这个问题
      2. **深入探索代码库**——找到相关的已有功能、API、UI组件、
         数据库表和设计模式。阅读实际文件，不要凭猜测。记录准确的文件路径
         以及每个文件的功能。
      3. 寻找常见的模式、反模式和最新趋势

      **第一性原理规则**：在建议任何新方案之前，先验证已有的内容。
      如果已有API端点、UI页面或组件部分解决了这个问题，请明确标注。
      最好的方案是扩展现有内容，而非替换它。

      向用户呈现摘要：

      **我的发现：**
      - {市场洞察——类似产品、竞争对手方案}
      - {代码库中已有的内容——具体文件、端点、组件}
      - {可能改变方向的关键洞察}

      然后提出**深入问题**：

      1. **愿景**：用一句话描述，如果大获成功，理想状态是什么？
      2. **核心用户**：描述你最重要的用户——他们的角色、场景，以及触发需求的情境。
      3. **待完成任务（JTBD）**：完成这句话："当[情境]，我想要[动机]，以便[结果]。"
      4. **非目标用户**：谁明确不是目标用户？
      5. **约束条件**：存在哪些限制？（时间、预算、技术、法规）

      调研结果是否改变或完善了你的想法？请回答深入问题。
    depends_on: [foundation-gate]

  # ═══════════════════════════════════════════════════════════════
  # 关卡2：用户回答深入问题
  # ═══════════════════════════════════════════════════════════════

  - id: deepdive-gate
    approval:
      message: "请回答上面的深入问题（愿景、核心用户、JTBD、约束条件）。结合调研结果补充任何调整。"
      capture_response: true
    depends_on: [research]

  # ═══════════════════════════════════════════════════════════════
  # 阶段3：技术调研 — 基于现有内容的可行性评估
  # ═══════════════════════════════════════════════════════════════

  - id: technical
    model: sonnet
    prompt: |
      你正在评估PRD的技术可行性。
      从第一性原理出发思考——从已有内容开始，而非从零开始构建。

      **核心想法**：$ARGUMENTS
      **基础回答**：$foundation-gate.output
      **深入回答**：$deepdive-gate.output

      **关键要求**：通过阅读实际文件来探索代码库。不要猜测或假设。
      对代码库的每一个声明，都必须引用准确的文件和行号。

      1. **已有内容**中哪些部分解决了这个问题？
         - 阅读已有的API端点、数据库查询、UI组件
         - 记录准确的函数名、表结构、组件名
         - 已经在收集/存储了哪些数据？
      2. **最小改动**是什么？对现有系统做哪些改动就能解决核心问题？
         - 优先扩展现有文件，而非创建新文件
         - 优先使用已有端点，而非创建新端点
         - 优先在已有UI页面上添加内容，而非创建新页面
      3. 我们需要的**基本要素**是什么？
         - 新的数据库查询？还是已有查询需要增加参数？
         - 新的组件？还是已有组件需要添加属性？
         - 新的端点？还是已有端点已经返回了所需数据？
      4. **风险**是什么？
         - 哪里可能出问题？
         - 哪些假设需要验证？

      呈现摘要：

      **已有内容（通过阅读代码验证）：**
      - {端点/组件/查询} 位于 `{文件:行号}` —— {功能说明}
      - {端点/组件/查询} 位于 `{文件:行号}` —— {功能说明}

      **解决问题的最小改动：**
      - {改动1}：{扩展/修改} `{文件}` —— {具体操作}
      - {改动2}：{扩展/修改} `{文件}` —— {具体操作}

      **技术背景：**
      - 可行性：{高/中/低}，因为{原因}
      - 关键风险：{主要顾虑}
      - 预估阶段：{粗略分解}

      然后提出**范围问题**：

      1. **MVP定义**：验证这个方案是否可行的绝对最小功能集是什么？
      2. **必须有 vs 最好有**：v1版本必须有哪2-3项？哪些可以延后？
      3. **核心假设**：完成这句话："我们相信[能力]将为[用户群]解决[问题]。当[可衡量结果]时，我们就知道假设成立。"
      4. **明确排除**：你明确不会构建什么？
      5. **待解决问题**：哪些不确定因素可能改变方案？
    depends_on: [deepdive-gate]

  # ═══════════════════════════════════════════════════════════════
  # 关卡3：用户回答范围问题
  # ═══════════════════════════════════════════════════════════════

  - id: scope-gate
    approval:
      message: "请回答上面的范围问题（MVP、必要功能、核心假设、排除项）。这是PRD生成前的最后一轮输入。"
      capture_response: true
    depends_on: [technical]

  # ═══════════════════════════════════════════════════════════════
  # 阶段4：生成 — 撰写PRD
  # ═══════════════════════════════════════════════════════════════

  - id: generate
    model: sonnet
    prompt: |
      你正在根据用户的引导式输入生成PRD。

      **核心想法**：$ARGUMENTS
      **基础回答**：$foundation-gate.output
      **深入回答**：$deepdive-gate.output
      **范围回答**：$scope-gate.output

      在 `$ARTIFACTS_DIR/prds/{kebab-case-name}.prd.md` 生成完整的PRD文件。

      首先创建目录：
      ```bash
      mkdir -p $ARTIFACTS_DIR/prds
      ```

      **第一性原理规则**：在撰写技术方案部分之前，阅读你引用的
      实际代码库文件。验证：
      - 文件路径存在
      - 函数/组件名称正确
      - 你引用的API端点确实存在（或标注需要创建）
      - 数据库表名和列名与架构匹配
      - 事件类型名称与代码中的常量匹配

      PRD必须包含以下所有章节，内容来自用户的回答：

      1. **问题描述** —— 来自基础回答（谁/什么/为什么）
      2. **证据** —— 来自调研发现和用户提供的证据
      3. **方案概述** —— 综合所有输入。优先扩展现有基本要素，而非创建新的。
      4. **核心假设** —— 来自范围回答
      5. **明确不构建的内容** —— 来自范围回答
      6. **成功指标** —— 来自基础的"如何判断"加范围回答
      7. **待解决问题** —— 来自范围回答
      8. **用户与场景** —— 来自深入回答（核心用户、JTBD、非目标用户）
      9. **方案详情** —— 来自范围必要功能的MoSCoW表、MVP定义
      10. **技术方案** —— 来自技术可行性评估。必须引用实际验证过的
          文件路径、函数名和数据库结构。将所有未验证的内容标记为"需要验证"。
      11. **实施阶段** —— 来自技术分解，包含状态表和并行机会
      12. **决策日志** —— 对话过程中做出的关键决策

      **规则：**
      - 如果信息缺失，写"待定——需要调研"，不要填充内容
      - 要具体和实际，不要泛泛而谈
      - 技术方案中的每个文件路径都必须通过阅读文件验证
      - 实施阶段中优先"扩展X"而非"新建Y"

      写入文件后，仅输出文件路径——验证器会检查它。
    depends_on: [scope-gate]

  # ═══════════════════════════════════════════════════════════════
  # 阶段5：验证 — 对照代码库检查技术声明
  # ═══════════════════════════════════════════════════════════════

  - id: validate
    model: sonnet
    prompt: |
      你是一位技术验证人员，正在检查PRD的准确性。

      阅读刚刚生成的PRD文件。generate节点输出了文件路径：
      $generate.output

      找到PRD文件——检查 `$ARTIFACTS_DIR/prds/` 中最近创建的 `.prd.md` 文件：
      ```bash
      ls -t $ARTIFACTS_DIR/prds/*.prd.md | head -1
      ```

      阅读整个PRD，然后对照实际代码库验证每一条技术声明：

      **检查1：文件路径** —— 对"技术方案"和"实施阶段"中引用的每个文件，
      验证其是否存在。如果不存在，记录修正内容。

      **检查2：API端点** —— 对提到的每个端点，检查它是否已存在于
      `packages/server/src/routes/api.ts`。如果存在，PRD应写"扩展"而非"创建"。
      如果PRD提出了一个新端点，但已有端点返回了相同数据，请标记。

      **检查3：数据库结构** —— 对引用的每个表/列，验证迁移文件或架构代码中的
      实际名称。检查事件类型名称是否与 `WORKFLOW_EVENT_TYPES` 常量匹配。

      **检查4：UI组件** —— 对引用的每个组件，验证其是否存在。
      如果PRD提出新建页面，但已有页面服务于类似目的，请标记。

      **检查5：函数/类型名称** —— 验证函数名、类型名和接口名是否正确。

      检查完毕后，如果需要任何修正：
      1. 直接编辑PRD文件——修正错误的名称、路径和引用
      2. 在底部添加 `## 验证备注` 章节，记录修正内容

      如果一切无误，添加：
      ```
      ## 验证备注

      所有技术引用已对照代码库验证。无需修正。
      ```

      输出检查和修正的摘要：

      ```
      ## PRD已验证

      **文件**：`{prd-path}`
      **检查项**：{N}个文件路径、{N}个端点、{N}个数据库引用、{N}个组件
      **修正数**：{count}
      {如有修正则列出}

      开始实施：`/prp-plan {prd-path}`
      ```
    depends_on: [generate]
